[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "urbanvista-reproducible"
version = "1.0.0"
description = "Reproducible PyTorch CNN-LSTM + OSM orientation fusion with geospatial data preparation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.3,<3", "numpy>=1.26,<3", "scipy>=1.11", "scikit-learn>=1.4",
  "pandas>=2.1", "matplotlib>=3.8", "PyYAML>=6.0", "tqdm>=4.66",
]
[project.optional-dependencies]
geo = ["rasterio>=1.3", "geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6", "osmnx>=2.0", "pystac-client>=0.8", "planetary-computer>=1.0", "requests>=2.31"]
baselines = ["timm>=1.0"]
test = ["pytest>=8"]
all = ["rasterio>=1.3", "geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6", "osmnx>=2.0", "pystac-client>=0.8", "planetary-computer>=1.0", "requests>=2.31", "timm>=1.0", "pytest>=8"]
[project.scripts]
urbanvista = "urbanvista.cli:main"
[tool.setuptools.packages.find]
include = ["urbanvista*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
